services:
  metube:
    image: ghcr.io/alexta69/metube:${METUBE_TAG}
    container_name: metube
    restart: unless-stopped
    environment:
      DOWNLOAD_DIR: /downloads/video
      AUDIO_DOWNLOAD_DIR: /downloads/music
      STATE_DIR: /config
    volumes:
      - ${MEDIA_DIR}:/downloads
      - metube-config:/config
    ports:
      - "8081:8081"
    networks:
      - media-net

  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_TAG}
    container_name: jellyfin
    restart: unless-stopped
    volumes:
      - ${MEDIA_DIR}:/media
      - jellyfin-config:/config
      - jellyfin-cache:/cache
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - media-net

networks:
  media-net:
    name: media-net

volumes:
  metube-config:
  jellyfin-config:
  jellyfin-cache: