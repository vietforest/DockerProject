services:
  metube:
    image: ghcr.io/alexta69/metube
    environment:
      DOWNLOAD_DIR: /downloads/video
      AUDIO_DOWNLOAD_DIR: /downloads/music
      STATE_DIR: /config
    volumes:
      - media:/downloads          # read-write: it produces the files
      - metube-config:/config
    ports:
      - "8081:8081"
    networks: [media-net]

  jellyfin:
    image: jellyfin/jellyfin:latest
    volumes:
      - media:/media:ro           # read-only: it only consumes
      - jellyfin-config:/config
      - jellyfin-cache:/cache
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [media-net]

networks:
  media-net:

volumes:
  media:
  metube-config:
  jellyfin-config:
  jellyfin-cache: